name: Desplegar EcoBlend MCP Nube
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar configuración privada
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ECOBLEND_PILOT_KEY: ${{ secrets.ECOBLEND_PILOT_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test ${#ECOBLEND_PILOT_KEY} -ge 24 || (echo "Falta ECOBLEND_PILOT_KEY (min 24 caracteres)" && exit 1)
      - name: Desplegar Worker y Durable Object
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config remote-mcp/wrangler.toml
      - name: Configurar clave privada sin publicarla
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ECOBLEND_PILOT_KEY: ${{ secrets.ECOBLEND_PILOT_KEY }}
        run: |
          printf '%s' "$ECOBLEND_PILOT_KEY" | npx --yes wrangler@4 secret put ECOBLEND_PILOT_KEY --config remote-mcp/wrangler.toml
